<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>Shelf</title>
    <meta name="description" content="A local-first shelf for agent-written HTML." />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Shelf" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="icon" href="/icons/icon-192.png" />
    <script>
      // Apply the stored theme before first paint, and mark the desktop shell so
      // the top bar can make room for the system traffic lights.
      try {
        const theme = localStorage.getItem("shelf-theme");
        if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
      } catch {}
      if ("__TAURI_INTERNALS__" in window) document.documentElement.classList.add("tauri");
    </script>
  </head>
  <body>
    <div id="app" aria-live="polite"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
